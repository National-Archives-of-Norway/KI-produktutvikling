name: ki-produktutvikling

# Ollama 0.40.16, offisiell multiarkitektur-digest verifisert 12. november 2026.
x-ollama-image: &ollama-image ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592

services:
  # Nedlasting skjer før inferensserveren starter; samme volum, egen prosess.
  model-init:
    image: *ollama-image
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "cp /bootstrap.sh /tmp/bootstrap.sh && exec sh /tmp/bootstrap.sh",
      ]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
      - ./scripts/ollama-pull.sh:/bootstrap.sh:ro
    networks: [download]
    restart: "no"

  ollama:
    image: *ollama-image
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-models:/root/.ollama
    networks: [model]
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen3:4b"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  portal:
    build: .
    image: ki-produktutvikling:compose
    init: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      MODEL_PROVIDER: ollama
      OLLAMA_MODEL: "qwen3:4b"
      # Målt CPU-profil; automatisk 18-trådsvalg ga kraftig ytelsestap.
      # Portalvariabelen videresendes som options.num_thread, ikke Ollama-env.
      OLLAMA_NUM_THREAD: "4"
      OLLAMA_URL: "http://ollama:11434"
      RAG_PORT: "3001"
      RAG_MAX_CONCURRENT: "1"
      RAG_ALLOWED_ORIGINS: "http://127.0.0.1:3005,http://localhost:3005"
    ports:
      - "127.0.0.1:3005:3000"
    networks: [web, model]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3001/health'),fetch('http://127.0.0.1:3000/spor')]).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:

networks:
  # Den kjørende modellserveren har verken vertsporter eller utgående internett.
  model:
    internal: true
  download:
  web:
