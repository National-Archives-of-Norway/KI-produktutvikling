name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_PROVIDER: none
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Versjonen leses fra packageManager i package.json.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # Fixture-tester; pricing:sync skal ikke kjøres av CI.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:pages
